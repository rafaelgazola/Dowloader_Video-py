<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131b">
  <title>YouTube Downloader</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="page-title">
      <h1 id="page-title">YouTube Downloader</h1>
      <p class="intro">Cole o link de um vídeo, escolha MP4 ou MP3 e baixe.</p>

      {% if error %}
      <div class="notice error" role="alert">{{ error }}</div>
      {% endif %}

      <form id="download-form" action="{{ url_for('download') }}" method="post">
        <label for="url">Link do vídeo</label>
        <input id="url" name="url" type="url" inputmode="url" placeholder="https://www.youtube.com/watch?v=..." value="{{ url or '' }}" required autocomplete="url">

        <fieldset>
          <legend>Formato</legend>
          <div class="options">
            <label class="option">
              <input type="radio" name="format" value="mp4" {% if selected_format != 'mp3' %}checked{% endif %}>
              <span><strong>Vídeo MP4</strong><small>Imagem e áudio</small></span>
            </label>
            <label class="option">
              <input type="radio" name="format" value="mp3" {% if selected_format == 'mp3' %}checked{% endif %}>
              <span><strong>Somente áudio MP3</strong><small>Arquivo de áudio</small></span>
            </label>
          </div>
        </fieldset>

        <button id="download-button" type="submit">Baixar <span aria-hidden="true">→</span></button>
        <p id="processing" class="processing" role="status" aria-live="polite" hidden>Preparando seu download...</p>
      </form>
      <p class="responsible">Baixe apenas conteúdo que você tem permissão para usar.</p>
    </section>
  </main>
  <script>
    const form = document.getElementById('download-form');
    const button = document.getElementById('download-button');
    const processing = document.getElementById('processing');
    form.addEventListener('submit', function () {
      button.disabled = true;
      processing.hidden = false;
      document.cookie = 'download_ready=; Max-Age=0; Path=/';
      const timer = setInterval(function () {
        if (document.cookie.split('; ').includes('download_ready=1')) {
          document.cookie = 'download_ready=; Max-Age=0; Path=/';
          button.disabled = false;
          processing.hidden = true;
          clearInterval(timer);
        }
      }, 500);
    });
  </script>
</body>
</html>
